name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/Oryksa.Tests -c Release
      - run: dotnet build examples/ConsoleChat -c Release
      - run: dotnet pack src/Oryksa -c Release -o out
      - uses: actions/upload-artifact@v4
        with: { name: nupkg, path: out/*.nupkg }
